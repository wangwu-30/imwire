[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imwire"
version = "0.1.0"
description = "Thin async client for `imwire serve` (JSON-RPC over stdio / WebSocket)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "imwire" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
ws = ["websockets>=13.0"]

[project.urls]
Homepage = "https://github.com/wangwu-30/imwire"

[tool.hatch.build.targets.wheel]
packages = ["src/imwire"]
